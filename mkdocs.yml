site_name: SRAM FastAPI
site_description: FastAPI application with SRAM OIDC authentication
repo_url: https://github.com/tudelft/sram-fastapi

theme:
  name: material
  palette:
    primary: blue
    accent: light-blue

nav:
  - Home: index.md
  - SRAM Setup: sram-setup.md
  - Authorization: authorization.md
  - Deployment: deployment.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
