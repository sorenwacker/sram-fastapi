repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: vulture
        name: vulture
        entry: uv run vulture src --min-confidence 80
        language: system
        types: [python]
        pass_filenames: false
